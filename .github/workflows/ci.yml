# What has to be true of every push and every pull request.
#
# The corpus is the reason this file exists: third-party notebooks written on
# an A5X, an A6X, a Nomad and a Manta, format versions 11 to 16, and the
# numbers read out of each when it was taken in. A firmware that changes the
# format shows up there first — which is only true if something runs it.
#
# What does not run here is the comparison against Ratta's own renderer: it
# needs a Supernote Private Cloud's `notelib` container, which a runner does
# not have, and those tests skip themselves without one (see the README).
#
# macOS, and not by preference: the package declares `.macOS(.v15)` and its
# public API speaks CoreGraphics. The Xcode is chosen rather than pinned —
# `Package.swift` asks for tools 6.3, and a runner image pinned to an older
# Xcode fails to parse the manifest at all, with an error that reads like a
# syntax error and is not one.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Least privilege, named rather than inherited: these jobs read the tree and
# write nothing.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the newest Xcode on the runner
        run: Scripts/ci-select-xcode.sh
      # Release: the golden-raster tests decode every page of every fixture,
      # five megapixels a layer, and an unoptimised build spends minutes on
      # it. Overflow and bounds checks stay on in release.
      - run: swift build --build-tests -c release
      - run: swift test -c release
      - run: swift test -c release --sanitize=address

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A release pinned by number rather than whatever Homebrew has today:
      # `--strict` turns every new rule a new SwiftLint ships into a red build,
      # and a build that goes red without a commit is a build nobody can
      # bisect.
      - name: Install SwiftLint 0.65.1
        run: |
          curl -fsSL -o swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  swiftlint.zip" | shasum -a 256 -c -
          unzip -q swiftlint.zip -d swiftlint-bin
      - run: swiftlint-bin/swiftlint lint --strict

  framework:
    name: Build the xcframework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the newest Xcode on the runner
        run: Scripts/ci-select-xcode.sh
      - run: brew install xcodegen
      # The artefact a consumer links against, built the way a release is: the
      # script's own checks refuse a static framework and one missing a slice.
      - run: Scripts/build-xcframework.sh
